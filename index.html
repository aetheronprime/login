<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=https://www.google.com">
    <title>Thank You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f7f9fc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.1);
            max-width: 500px;
        }

        .success-icon {
            font-size: 64px;
            color: #6e8efb;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .redirect {
            font-size: 14px;
            color: #999;
            margin-top: 20px;
        }

        .loader {
            height: 4px;
            width: 100%;
            background-color: #f1f1f1;
            margin: 30px 0 10px;
            position: relative;
            overflow: hidden;
        }

        .loader:after {
            content: '';
            position: absolute;
            left: -50%;
            height: 4px;
            width: 40%;
            background-color: #6e8efb;
            animation: loading 2s linear infinite;
        }

        @keyframes loading {
            from {left: -50%;}
            to {left: 100%;}
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>Login Successful!</h1>
        <p>Thank you for logging in. You will be redirected to your account dashboard shortly.</p>
        <div class="loader"></div>
        <p class="redirect">Redirecting you in a few seconds...</p>
    </div>
    
    <script>
        // Count down from 3
        let seconds = 3;
        const updateCountdown = () => {
            if (seconds > 0) {
                seconds--;
                setTimeout(updateCountdown, 1000);
            }
        };
        updateCountdown();
    </script>
</body>
</html>
